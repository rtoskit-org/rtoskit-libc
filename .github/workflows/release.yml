# The release (docs/release.md, PLAN D158). Pushing a tag vX.Y.Z runs the pull request gate of ci.yml on the
# tagged commit for every architecture, packages each architecture's release and speed builds with
# tools/scripts/release-package, attests the packages' provenance and opens a DRAFT release holding them,
# SHA256SUMS and the notes: docs/release/vX.Y.Z.md, then GitHub's generated list of the pull requests since
# the previous published release (grouped by .github/release.yml; none for the first release). Nothing is public until the maintainer reviews
# the draft and presses Publish. Re-run it for an existing tag from the Actions tab (workflow_dispatch).
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag, e.g. v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, armv6-m, armv6s-m, armv7-m, armv7e-m, armv7e-m-dp, armv8-m.main]
    steps:
      - name: Install packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git make gcc libc6-dev python3 qemu-user wget xz-utils

      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Release notes present
        run: test -f "docs/release/${TAG}.md" || { echo "docs/release/${TAG}.md is missing"; exit 1; }

      - name: make check
        run: make -j"$(nproc)" ARCH_CROSS=${{ matrix.arch }} check

      - name: Size
        if: matrix.arch != 'x86_64'
        run: |
          tools/scripts/size-report diff --arch ${{ matrix.arch }}
          tools/scripts/size-report budget --arch ${{ matrix.arch }}
          tools/scripts/size-report --build-type speed budget --flavour speed --arch ${{ matrix.arch }}

      - name: Package
        run: tools/scripts/release-package "${TAG#v}" ${{ matrix.arch }} dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

  draft:
    name: draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.xz >SHA256SUMS
          cat SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.xz

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "A release for ${TAG} exists already; delete the draft to make it again"
            exit 1
          fi
          prerelease=
          case "${TAG}" in
            v0.* | *-*) prerelease=--prerelease ;;
          esac
          # The pull requests since the previous published release follow the hand-written notes; the first
          # release has none to start from, and its notes cover the whole history
          generate=
          if [ -n "$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[].tagName')" ]; then
            generate=--generate-notes
          fi
          gh release create "${TAG}" dist/*.tar.xz dist/SHA256SUMS \
            --draft --verify-tag ${prerelease} ${generate} \
            --title "rtoskit-libc ${TAG}" \
            --notes-file "docs/release/${TAG}.md"
